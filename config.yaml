# =====================================================================
# Shared settings for the whole Tan Chau water-level forecasting project
# Edit settings here rather than in the individual training scripts
# =====================================================================

# Relative paths, resolved from the folder containing this file (the repository root).
# processed_dir: train_final.csv, valid_final.csv, test_final.csv created by src/preprocessing/preprocess_features.py.
duong_dan:
  processed_dir: "data/processed"
  targets_dir: "data/targets"
  model_dir: "models"
  ket_qua_dir: "results"
  hinh_anh_dir: "results/figures"

cot:
  date: "date"
  muc_nuoc: "H_TanChau"
  muc_nuoc_hien_tai: "H_hientai"      # used for the persistence baseline

nguong:
  bao_dong_m: 3.5        # Alarm Level I at Tan Chau (Decision 05/2020/QD-TTg; the old value 3.0 belongs to Chau Doc); not used by any code
  m2_vuot_nguong_m: 2.5  # M2 threshold (2.5 m because some years never exceed 3.0 m)
  mua_lu_m: 2.0          # threshold defining the start / end of the flood season (M3)
  han_m: 0.5             # dry-season low-water threshold (M4)

mua_vu:
  thang_mua_lu: [8, 9, 10, 11]     # M2
  thang_mua_lu_rong: [5, 6, 7, 8, 9, 10, 11, 12]  # M3
  thang_mua_kho: [1, 2, 3, 4, 5]   # M4

m1:
  horizons: [1, 2, 3, 5, 7, 14]

m2:
  cua_so_ngay: 10        # count days above the threshold in the next 10 days

m4:
  horizons: [7, 15]

# Chronological data split (same cut-off dates as the 3 existing files)
chia_du_lieu:
  train_den: "2021-12-31"
  valid_den: "2022-12-31"
  # the remainder (2023-2024) is the test set

# Identical tuning settings for ALL models
tuning:
  n_iter: 20             # number of parameter combinations tried per algorithm
  n_splits: 5            # number of TimeSeriesSplit folds
  gap: 14                # days between training and validation in each fold (prevents leakage)
  random_state: 42
  n_jobs: -1
  scoring_hoi_quy: "neg_root_mean_squared_error"
  scoring_phan_loai: "average_precision"

thuat_toan: ["dt", "rf", "lgbm", "catboost", "svr"]
